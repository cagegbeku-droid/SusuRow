name: Build Android App Bundle (Google Play)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Assets
        working-directory: frontend
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android App Bundle (AAB for Google Play)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Universal APK (for Direct Testing & Install)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: susurow-release-bundle
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Debug APK (Direct Android Testing)
        uses: actions/upload-artifact@v4
        with:
          name: susurow-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
